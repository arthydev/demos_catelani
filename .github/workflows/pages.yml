name: Deploy landing pages to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "landingpages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p site
          cp landingpages/index.html site/
          for page_dir in landingpages/dra-*; do
            site_dir="site/${page_dir##*/}"
            mkdir -p "$site_dir/assets"
            cp "$page_dir/index.html" "$page_dir/styles.css" "$page_dir/script.js" "$site_dir/"
            cp -R "$page_dir/assets/." "$site_dir/assets/"
          done
      - name: Upload landing pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
